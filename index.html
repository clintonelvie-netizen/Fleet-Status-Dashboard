<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fleet Status Dashboard</title>
  <link rel="stylesheet" href="addin.css">
</head>
<body>
  <div class="dashboard">

    <header class="dashboard__header">
      <h1 class="dashboard__title">Fleet Status Dashboard</h1>
      <p class="dashboard__subtitle">Fleet Overview</p>
    </header>

    <!-- Exactly one of the four state containers below is visible at a time.
         See setState() in addin.js. -->

    <div id="state-loading" class="state state--loading">
      Loading fleet status&hellip;
    </div>

    <div id="state-error" class="state state--error" hidden>
      <p class="state__line">Unable to load fleet status.</p>
      <p class="state__line">Please try again.</p>
    </div>

    <div id="state-empty" class="state state--empty" hidden>
      No vehicles found in this fleet.
    </div>

    <div id="state-table" hidden>
      <div class="table-wrap">
        <table class="fleet-table">
          <thead>
            <tr>
              <th scope="col" class="col-vehicle">Vehicle</th>
              <th scope="col" class="col-driver">Driver</th>
              <th scope="col" class="col-comm">Last Communication</th>
              <th scope="col" class="col-status">Status</th>
            </tr>
          </thead>
          <tbody id="fleet-rows"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="addin.js"></script>
</body>
</html>
